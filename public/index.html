<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 视频深度总结</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <script src="app.js" defer></script>
</head>
<body class="bg-zinc-50 min-h-screen p-4 md:p-16">
    <main class="max-w-4xl mx-auto flex flex-col gap-8">
        
        <article id="output-wrapper" class="hidden bg-white p-10 md:p-20 shadow-xl rounded-sm order-1">
            <div id="content" class="prose serif max-w-none"></div>
            <div id="loader" class="mt-10 text-blue-600 font-medium border-t pt-8">
                <span class="cursor-blink"></span> 
                <span id="status">正在同步数据...</span>
            </div>
        </article>

        <section id="setup-panel" class="bg-white p-8 rounded-xl shadow-sm border order-2">
            <h2 id="setup-title" class="text-2xl font-bold mb-6 text-gray-800">自动视频内容总结</h2>
            <div class="space-y-4">
                <input type="password" id="apiKey" placeholder="Gemini API Key" 
                    class="w-full p-4 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                <input type="text" id="url" placeholder="YouTube URL" 
                    class="w-full p-4 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                <button id="start-btn" class="w-full bg-blue-600 text-white font-bold py-4 rounded-lg hover:bg-blue-700 transition active:scale-95 shadow-lg shadow-blue-100">
                    开始生成
                </button>
            </div>
        </section>
        
    </main>
</body>
</html>
